{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}

<!--Add review page-->
<div class="conteiner mt-4">
    <div class="card">
        <div class="card-body">
            <!-- Page title-->
             <h1>Add Review</h1>

             <p>
                Review for <strong>{{ course.title }}</strong>
             </p>
          <!--Review form-->
          <form method="POST">
            {%csrf_token%}

            {{form|crispy}}
         <!--Rating buttons -->
         <div class="mb-3">
            <p>Rating:</p>
            <button type="button" class="btn btn-secondary rating-btn" value="1">1</button>
            <button type="button" class="btn btn-secondary rating-btn" value="2">2</button>
            <button type="button" class="btn btn-secondary rating-btn" value="3">3</button>
            <button type="button" class="btn btn-secondary rating-btn" value="4">4</button>
            <button type="button" class="btn btn-secondary rating-btn" value="5">5</button>
            <button type="button" class="btn btn-secondary rating-btn" value="6">6</button>
            <button type="button" class="btn btn-secondary rating-btn" value="7">7</button>
            <button type="button" class="btn btn-secondary rating-btn" value="8">8</button>
            <button type="button" class="btn btn-secondary rating-btn" value="9">9</button>
            <button type="button" class="btn btn-secondary rating-btn" value="10">10</button>
         </div>
             <!--Cancel button-->
             <a href="{%url 'course_detail' course.id%}"
             class="btn btn-secondary">
             Cancel
            </a>
            <!--Add review button-->
            <button type="submit"
              class="btn btn-primary">
              Add review
            </button>
          </form>
        </div>
    </div>
</div>
{% endblock %}
