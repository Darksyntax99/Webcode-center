{% extends "base.html"%}
{% load crispy_forms_tags %}
{% block content %}

<!-- Edit course page-->
 <div class="container mt-4">
    <div class="row">
        <div class="col-12 col-md-6">

        <!--page title-->
        <h1 class="mb-4">Edit Course</h1>
<!--Edit course form-->
<form method="POST"
 action="{%url 'edit_course' course.id %}">
 {% csrf_token %}
 {{form|crispy}}
 <!--Form buttons-->
 <a href="{%url 'course_detail' course.id%}"
   class="btn btn-secondary">
   Cancel
</a>
<button type="submit"
  class="btn btn-primary">
  Update course
</button>
</form>
        </div>
    </div>
 </div>
 {% endblock %}
