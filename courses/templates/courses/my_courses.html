{% extends "base.html" %}
{% block content %}

<!--My courses page-->
<div class="container mt-4">
    <!--page title-->
    <h1 class="mb-4">My Courses</h1>
<!--My courses card -->
<div class="card">
  <div class="card-body">
    <h2>Your Courses</h2>
    {% for enrollment in enrollments%}
    <div class="mb-4">
        <h3 class="h5">
        {{enrollment.course.title}}
        </h3>
        <p>{{ enrollment.course.description}}</p>
        <a href="{%url 'course_detail' enrollment.course.id %}"
        class="btn btn-primary">
    View Course
</a>
</div>

{% empty %}
<p>
    Your purchased courses will appear here 
</p>
{% endfor %}
<a href ="{% url 'courses_home' %}"
class="btn btn-secondary">
Back to courses 
</a>
</div>
{% endblock %}
