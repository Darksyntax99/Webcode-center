{% extends "base.html" %}
{% block content %}

<div class="container mt-5">
 <div class="row justify-content-center">
    <div class="col-md-6">

        <!--Login card-->
        <div class="card">
            <div class="card-body">
           <h1 class="h3 mb-4">Login</h1>

           <!-- Login form-->
            <form method="post">
                {% csrf_token %}

                {{ form.as_p}}
                <button type="submit" class="btn btn-primary">
                    Login
                </button>
            </form>

            <!--register link -->
            <p class="mt-3">
                I dont have an account?
                <a href="{% url 'account_signup' %}">
                register
                </a>
            </p>
            </div>
        </div>
    </div>
 </div>
</div>
{% endblock %}
