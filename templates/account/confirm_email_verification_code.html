{% extends "base.html" %}
{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
    <div class="col-md-6">

        <!--verification card-->
        <div class="card">
            <div class="card-body">

                <!--Page title-->
                <h1 class="h3 mb-4">
                    Email verification
                </h1>

                <p>
                    enter the verification link sent to your email.
                </p>

                <!--verification form -->
                <form method ="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit"
                    class="btn btn-primary">
                    Verify Email
                </button>
                </form>

                <!--login link -->
                <a href ="{% url 'account_login' %}"
                class="btn btn-secondary mt-3">
                back to login
            </a>
            </div>
        </div>
    </div>
    </div>
</div>
{% endblock %}
